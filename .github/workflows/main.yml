name: Build HTML to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download web-to-apk tool
        run: |
          wget -O web-to-apk.jar https://github.com/shreyas-londhe/web-to-apk/releases/download/v1.0/web-to-apk.jar

      - name: Build APK
        run: |
          # Make sure your HTML file is named index.html
          # If it has a different name, change this line
          java -jar web-to-apk.jar --html index.html --name "MyApp" --output app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: app.apk
