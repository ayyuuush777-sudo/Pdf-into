name: Build Android App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Convert HTML to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."           # 在当前目录找你的 HTML 文件
          app-name: "MyApp"                # 你的 App 名称
          output-folder-path: "my-apks"    # 存放 APK 的文件夹

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: my-apks/                   # 与上面的 output 路径保持一致
