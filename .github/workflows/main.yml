name: PWA to Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PWABuilder Package
        uses: pwabuilder/package@v1
        with:
          platform: android
          output: ./packages
          # If your manifest is not at root, specify path:
          # manifestPath: ./manifest.json

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: ./packages
