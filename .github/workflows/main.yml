name: Build PWA for Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build Android package (APK + AAB)
        run: |
          npx pwabuilder package --platform android --project . --output ./android-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: ./android-build/*.{apk,aab}
