name: Build Android App with Cordova

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Debug Keystore
        id: cache-keystore
        uses: actions/cache@v3
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Generate Debug Keystore (if not cached)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" -storepass android -keypass android
          echo "🆕 New keystore generated. SHA-1 will be different!"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1"

      - name: Get SHA-1 (from cached or newly generated)
        run: |
          echo "=================================================="
          echo "SHA-1 FINGERPRINT (Copy this to Google Cloud Console):"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1"
          echo "=================================================="

      - name: Build with Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.example.myapp MyApp --copy-from .
          cd myapp
          cp ../index.html www/index.html
          cordova plugin add cordova-plugin-splashscreen
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
